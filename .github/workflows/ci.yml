name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode build and tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PROJECT: ClassHelper.xcodeproj
      SCHEME: ClassHelper
      DESTINATION: platform=macOS,arch=arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Xcode and scheme
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          xcodebuild -list -project "$PROJECT"

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ClassHelperBuild" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ClassHelperUnitTests" \
            -parallel-testing-enabled NO \
            -only-testing:ClassHelperTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ClassHelperUITests" \
            -parallel-testing-enabled NO \
            -only-testing:ClassHelperUITests
